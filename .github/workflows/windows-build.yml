name: Syph for Windows

on:
  push:
    paths:
      - "windows/**"
      - "ci/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - "ci/**"
  workflow_dispatch:
    inputs:
      agent_eval:
        description: "Also run the agent eval against a real server (needs SYPH_EVAL_* secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install
        working-directory: windows
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: windows
        run: |
          npm run typecheck
          npm test
      - name: Build native helper (SyphHost.exe)
        working-directory: windows
        run: |
          npm run build:host
          Get-Item host\publish\SyphHost.exe | Format-Table Name, Length
      - name: Native helper self-test (real desktop)
        working-directory: windows
        run: |
          New-Item -ItemType Directory -Force ..\shots | Out-Null
          $p = Start-Process host\publish\SyphHost.exe -ArgumentList '--selftest', '--out', '..\shots\host-selftest.json' -PassThru -Wait -NoNewWindow
          Get-Content ..\shots\host-selftest.json
          if ($p.ExitCode -ne 0) { Write-Error "host self-test failed"; exit 1 }
      - name: Sign native helper (when a certificate is configured)
        working-directory: windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { Write-Host "No WINDOWS_CSC_LINK secret: building unsigned."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CSC_LINK))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CSC_KEY_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 host\publish\SyphHost.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Build (unpacked, installer, portable)
        working-directory: windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          npm run build
          # Signing (and resource editing by electron-builder) only when a certificate exists;
          # otherwise afterPack stamps the icon and version with resedit.
          $sign = if ($env:CSC_LINK) { '-c.win.signAndEditExecutable=true' } else { '-c.win.signAndEditExecutable=false' }
          if (-not $env:CSC_LINK) { Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          npx electron-builder --win dir nsis portable --x64 --publish never $sign
          Get-ChildItem release | Format-Table Name, Length
      - name: Screenshots (demo fixture)
        working-directory: windows
        env:
          CHROMIUM: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node scripts/screenshots.mjs ../shots
      - name: End-to-end computer control (device contract)
        run: |
          # Allow every scope so the harness exercises each operation without a consent click.
          $policy = @{ controlEnabled = $true; sharedFolders = @("$env:USERPROFILE\Documents\Syph")
                       modes = @{ observe = 'allow'; screen = 'allow'; control = 'allow'; apps = 'allow'; clipboard = 'allow'
                                  files_read = 'allow'; files_write = 'allow'; shell = 'allow'
                                  browser = 'allow'; office = 'allow'; files_outside = 'off' } } | ConvertTo-Json -Depth 4
          foreach ($name in 'Syph', 'syph-windows') {
            New-Item -ItemType Directory -Force "$env:APPDATA\$name" | Out-Null
            Set-Content -Path "$env:APPDATA\$name\computer.json" -Value $policy -Encoding utf8
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:SYPH_PLATFORM = 'windows'
          $env:SYPH_ALLOW_PLAIN_POLICY = '1'
          $harness = Start-Process python -ArgumentList 'ci/device_contract_e2e.py' -RedirectStandardOutput e2e.log -RedirectStandardError e2e.err -PassThru -NoNewWindow
          Start-Sleep 2
          $app = Start-Process 'windows\release\win-unpacked\Syph.exe' -ArgumentList '--server=http://127.0.0.1:8765', '--email=ryan@jarvis.local', '--password=e2e', '--section=computer' -PassThru
          Start-Sleep 25
          & ci\windows-screenshot.ps1 shots\e2e-live.png
          $harness.WaitForExit(330000) | Out-Null
          & ci\windows-screenshot.ps1 shots\e2e.png
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content e2e.log
          Get-Content e2e.err -ErrorAction SilentlyContinue
          if ($harness.ExitCode -ne 0) { exit 1 }
      - name: Agent eval (real server, real model)
        if: github.event_name == 'workflow_dispatch' && inputs.agent_eval
        env:
          SYPH_SERVER: ${{ secrets.SYPH_EVAL_SERVER }}
          SYPH_EMAIL: ${{ secrets.SYPH_EVAL_EMAIL }}
          SYPH_PASSWORD: ${{ secrets.SYPH_EVAL_PASSWORD }}
          SYPH_EMPLOYEE: ${{ secrets.SYPH_EVAL_EMPLOYEE }}
          SYPH_EVAL_OUT: ${{ github.workspace }}\shots\agent-eval
        run: |
          if (-not $env:SYPH_SERVER) { Write-Error "Set the SYPH_EVAL_SERVER, SYPH_EVAL_EMAIL, SYPH_EVAL_PASSWORD and SYPH_EVAL_EMPLOYEE secrets."; exit 1 }
          $env:SYPH_ALLOW_PLAIN_POLICY = '1'
          $app = Start-Process 'windows\release\win-unpacked\Syph.exe' -ArgumentList "--server=$env:SYPH_SERVER", "--email=$env:SYPH_EMAIL", "--password=$env:SYPH_PASSWORD", '--section=computer' -PassThru
          Start-Sleep 30
          python ci/agent_eval.py
          $code = $LASTEXITCODE
          & ci\windows-screenshot.ps1 shots\agent-eval-end.png
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syph-Windows-screenshots
          path: shots
      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Syph-Windows
          path: |
            windows/release/*.exe
            !windows/release/win-unpacked/**
